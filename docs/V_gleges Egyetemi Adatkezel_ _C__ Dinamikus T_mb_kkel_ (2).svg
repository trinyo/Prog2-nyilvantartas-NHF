<svg version="1.1" baseProfile="full" width="1081.0" height="697.0" viewBox="0 0 1081 697" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events">
	<title >Végleges Egyetemi Adatkezelő (C++ Dinamikus Tömbökkel)</title>
	<desc >#direction: right
	#spacing: 40
	#padding: 15
	#fontSize: 10
	#title: Végleges Egyetemi Adatkezelő (C++ Dinamikus Tömbökkel)
	
	[&lt;abstract&gt;Szemely|
	  - nev: string
	  - kod: string
	  - email: string
	  - csoportok: string*
	  - csopSzam: int
	|
	  + Szemely(n, k, e)
	  + virtual ~Szemely()
	  + virtual void kiir() const = 0
	  + addCsoport(string cs)
	  + getKod() const: string
	  + getCsopSzam() const: int
	  + getCsoport(int i) const: string
	]
	
	[Szemely] &lt;:- [Hallgato]
	[Szemely] &lt;:- [Oktato]
	
	[Hallgato|
	  - szak: string
	  - felev: int
	  - hianyzas: int
	  - zhPontok: double*
	  - zhSzam: int
	  - nzh: double
	  - vizsga: double
	  - osztondij: bool
	  - statusz: string
	  - extra_pont: int
	  - megjegyzes: string
	|
	  + Hallgato(...)
	  + ~Hallgato()
	  + kiir() override
	  + addZH(double p)
	  + getNzh() const: double
	  + getOsztondij() const: bool
	  + getStatusz() const: string
	]
	
	[Oktato|
	  - titulus: string
	  - tanszek: string
	  - iroda: string
	  - targy: string
	  - konzultacio: string
	  - maxCsop: int
	|
	  + Oktato(...)
	  + ~Oktato()
	  + kiir() override
	  + getTanszek() const: string
	]
	
	[Parser|
	  - adatok: Szemely**
	  - kapacitas: int
	  - meret: int
	|
	  + Parser()
	  + ~Parser()
	  + beolvas(string file)
	  + mentes(string file)
	  + hozzaad(Szemely* uj)
	  + keresKodAlapjan(string k): Szemely*
	  + listazMindenkit()
	  + listazHallgatok()
	  + listazOktatok()
	  + listazPZH_Kotelezettek()
	  + listazOsztondijasok()
	  + listazCsoportAlapjan(string cs)
	  + listazTanszekAlapjan(string tszk)
	  + listazKivaloStatuszuak()
	|
	  - atmeretez()
	  - sorFeldolgoz(string sor)
	]
	
	[Parser] o-&gt; [Szemely]
	
	[Menu|
	  - parser: Parser&amp;
	|
	  + Menu(Parser&amp; p)
	  + start()
	  - displayMainMenu()
	  - displayListMenu()
	  - displayNewDataMenu()
	  - displayDataManagementMenu()
	  - clearScreen()
	  - waitForEnter()
	]
	
	[Menu] -&gt; [Parser]</desc>
